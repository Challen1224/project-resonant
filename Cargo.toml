[workspace]
resolver = "3"
members = [
    "applications/resonant-studio",
    "crates/resonant-core",
    "crates/resonant-audio",
]

[workspace.dependencies]
cpal = "0.18.2"
rtrb = "0.4.1"
winit = "0.30.13"
wgpu = "26.0.1"
wgpu_text = "26.0.0"
pollster = "0.4"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Challen1224/project-resonant"

[workspace.lints.rust]
unsafe_code = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
